---
layout: default
---
{% assign lang = page.lang | default: site.default_lang %}
{% assign t = site.data[lang] %}
<article class="post">
  <div class="wrap wrap-narrow">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      <p class="post-meta">{{ t.post.published }} {{ page.date | date: "%Y-%m-%d" }}</p>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
    <footer class="post-footer">
      <a href="{{ '/archive/' | relative_url }}">&larr; {{ t.post.back }}</a>
    </footer>
  </div>
</article>
